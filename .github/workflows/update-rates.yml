name: Update exchange rates

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = 07:00 Vietnam time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch rates
        run: python scripts/update_rates.py
      - name: Rebuild conversion tables
        run: python scripts/build_tables.py
      - name: Commit if changed
        run: |
          git add rates.json sitemap.xml guides/vnd-to-*.html ja/vnd-yen-hayamihyo.html
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update rates $(date -u +%Y-%m-%d)"
          # GitHub occasionally returns a transient 500 on push; retry a few times.
          for i in 1 2 3; do
            git push && exit 0
            echo "push failed (attempt $i), retrying"
            sleep 20
            git pull --rebase
          done
          exit 1
      - name: Wait for the site to publish
        run: sleep 90
      - name: Notify search engines (IndexNow)
        run: python scripts/indexnow.py
